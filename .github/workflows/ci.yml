name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on shell scripts
        run: |
          shellcheck submit_rnaseq.sh submit_virus_polish.sh bin/*.sh

      - name: Verify bash script syntax
        run: |
          for f in submit_rnaseq.sh submit_virus_polish.sh bin/*.sh; do
            echo "Checking syntax for $f..."
            bash -n "$f"
          done

      - name: Run pytest test suite
        run: |
          pytest
